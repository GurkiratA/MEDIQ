[project]
name = "runofflab"
version = "0.1.0"
description = "RunoffLab — stormwater & green infrastructure optimizer built on EPA SWMM"
requires-python = ">=3.11"
dependencies = [
    "pyswmm==2.2.0",          # bundles EPA SWMM 5.2.4 via swmm-toolkit 0.17.0
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runofflab*"]

[tool.setuptools.package-data]
runofflab = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
